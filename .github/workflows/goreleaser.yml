name: GoReleaser

# Path-filtered: NOT suitable as a required branch-protection check (a PR
# that doesn't touch these paths would leave the check pending forever).
# ci.yml is the always-run candidate for required checks.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - .goreleaser.yaml
      - mise.toml
      - .github/workflows/goreleaser.yml
      - .github/workflows/release.yml
      - .release-please-manifest.json
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local

jobs:
  snapshot:
    name: Snapshot build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: 'go goreleaser ko'

      - name: Validate configuration
        run: goreleaser check

      - name: Snapshot release (no publish)
        run: goreleaser release --snapshot --clean
