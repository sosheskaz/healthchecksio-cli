name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.2.3)'
        required: true
      tap_github_token:
        description: 'GitHub token for authent'
        required: false
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      tap_github_token:
        required: false
        type: string
    secrets:
      BREW_PAT:
        description: 'PAT for pushing to the homebrew-tap repo'
        required: false

permissions:
  contents: write
  packages: write

env:
  REF: ${{ inputs.release_tag || github.ref }}
  TAP_GITHUB_TOKEN: ${{ inputs.tap_github_token || secrets.BREW_PAT || github.token }}
  GOTOOLCHAIN: local

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Serialize releases: concurrent runs would race on the ghcr.io
    # latest/major tags, letting an older release finish last and win.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.REF }}
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: 'ko go goreleaser'
          # Published artifacts must never be built from state a PR-writable
          # cache could have poisoned; releases pay for pristine toolchains.
          cache: false

      - name: Login to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release with GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
